name: Build

# Baut bei jedem Push den Open Game Launcher für Windows, Linux und macOS (x86_64 + ARM64),
# testet ihn und packt alle Formate. Auf main wird für jede NEUE Version (aus Cargo.toml)
# einmalig ein GitHub-Release erstellt – ein bestehendes Release wird nie überschrieben.
#
# Sicherheit: Build-Jobs haben nur Leserechte. Schreibrechte haben nur die kleinen Jobs
# "release", "ci-log" und "pages", die keinen Projektcode ausführen. Actions sind gepinnt.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            exe: Open-Game-Launcher.exe
            legacy: MAZ-Launcher.exe
          - arch: arm64
            target: aarch64-pc-windows-msvc
            exe: Open-Game-Launcher-arm64.exe
            legacy: MAZ-Launcher-arm64.exe
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Design (Tailwind CSS) neu erzeugen
        shell: bash
        run: |
          set -o pipefail
          # Tailwind braucht das Paket "tailwindcss" neben der CSS-Datei (für @import)
          npm install --no-save --no-audit --no-fund --ignore-scripts tailwindcss@4.3.3 @tailwindcss/cli@4.3.3 2>&1 | tee css-${{ runner.os }}-${{ runner.arch }}.log
          npx @tailwindcss/cli -i tailwind.css -o assets/maz.css --minify 2>&1 | tee -a css-${{ runner.os }}-${{ runner.arch }}.log

      - name: Build
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }} --message-format=short 2>&1 | Tee-Object -FilePath build-windows-${{ matrix.arch }}.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Tests
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          cargo test --release --target ${{ matrix.target }} 2>&1 | Tee-Object -FilePath test-windows.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Sicherheitsprüfung der Bibliotheken (cargo audit)
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit 2>&1 | Tee-Object -FilePath audit.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Dateien einsammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/Open-Game-Launcher.exe dist/${{ matrix.exe }}
          # Gleiche Datei unter dem alten Namen: Launcher bis 1.7 suchen beim Update genau diesen Namen
          Copy-Item target/${{ matrix.target }}/release/Open-Game-Launcher.exe dist/${{ matrix.legacy }}
          # Keine mit UPX gepackte Variante mehr: gepackte EXEs werden oft fälschlich als Virus
          # gemeldet und vertragen sich nicht mit Control Flow Guard.
          if ("${{ matrix.arch }}" -eq "x86_64") {
            Copy-Item Cargo.lock dist/Cargo.lock
          }

      - name: Erweiterungen bauen und packen (.ogext)
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          foreach ($e in @(@{dir="humble-app"; name="Humble-App"}, @{dir="legacy-games"; name="Legacy-Games"})) {
            $d = "extensions/$($e.dir)"
            cargo test --release --manifest-path "$d/Cargo.toml" 2>&1 | Tee-Object -Append -FilePath extensions-windows.log
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cargo build --release --manifest-path "$d/Cargo.toml" 2>&1 | Tee-Object -Append -FilePath extensions-windows.log
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $stage = "ext-stage/$($e.dir)"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "$d/manifest.json" $stage
            Copy-Item -Recurse "$d/lang" $stage
            Copy-Item "$d/target/release/og-ext-$($e.dir).exe" $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$($e.name).zip" -Force
            Move-Item -Force "dist/$($e.name).zip" "dist/$($e.name).ogext"
          }

      - name: Oberflächen-Test (Bildschirmfoto)
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $out = "ui-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath "target/${{ matrix.target }}/release/Open-Game-Launcher.exe" -ArgumentList "--ui-test", $out -PassThru
          for ($i = 0; $i -lt 120; $i++) { if (Test-Path "$out/ui-test.json") { break }; Start-Sleep 1 }
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("ui-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          python -m pip install --quiet pillow
          python scripts/ui-check.py "$out/ui-test.json" ui-windows.png tests/ui/baseline-windows.png 2>&1 | Tee-Object -FilePath ui-test-windows.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Ungültige Version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-windows-${{ matrix.arch }}
          path: |
            *.log
            ui-*.png
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Systempakete
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev pkg-config \
            rpm libarchive-tools zstd flatpak dbus

      - name: Design (Tailwind CSS) neu erzeugen
        shell: bash
        run: |
          set -o pipefail
          # Tailwind braucht das Paket "tailwindcss" neben der CSS-Datei (für @import)
          npm install --no-save --no-audit --no-fund --ignore-scripts tailwindcss@4.3.3 @tailwindcss/cli@4.3.3 2>&1 | tee css-${{ runner.os }}-${{ runner.arch }}.log
          npx @tailwindcss/cli -i tailwind.css -o assets/maz.css --minify 2>&1 | tee -a css-${{ runner.os }}-${{ runner.arch }}.log

      - name: Build
        run: |
          set -o pipefail
          cargo build --release --message-format=short 2>&1 | tee build-linux-${{ matrix.arch }}.log

      - name: Tests
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee test-linux-${{ matrix.arch }}.log

      # Clippy: der neue Code (Erweiterungen) muss ohne Warnungen sein (#![deny(clippy::all)])
      - name: Clippy
        if: matrix.arch == 'x86_64'
        run: |
          set -o pipefail
          rustup component add clippy
          cargo clippy --release --message-format=short 2>&1 | tee clippy-linux.log

      - name: Erweiterungen testen
        if: matrix.arch == 'x86_64'
        run: |
          set -o pipefail
          for d in extensions/*/; do cargo test --release --manifest-path "$d/Cargo.toml" 2>&1 | tee -a extensions-linux.log; done

      - name: Steam-Deck-Plugin (Decky) testen und bauen
        if: matrix.arch == 'x86_64'
        run: |
          set -o pipefail
          cd decky-plugin
          python3 -m unittest test_main 2>&1 | tee ../decky-linux.log
          # Feste Versionen, keine Installations-Skripte aus Paketen
          npm install --no-audit --no-fund --ignore-scripts 2>&1 | tee -a ../decky-linux.log
          npm run build 2>&1 | tee -a ../decky-linux.log
          test -s dist/index.js
          rm -rf ../decky-stage && mkdir -p ../decky-stage/Open-Game-Launcher/dist
          cp plugin.json package.json main.py LICENSE README.md ../decky-stage/Open-Game-Launcher/
          cp dist/index.js ../decky-stage/Open-Game-Launcher/dist/
          mkdir -p ../dist
          (cd ../decky-stage && zip -qr ../dist/Open-Game-Launcher-Decky.zip Open-Game-Launcher)

      - name: Oberflächen-Test (Bildschirmfoto)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y -qq xvfb imagemagick x11-apps python3-pil
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          DISPLAY=:99 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 \
            scripts/ui-test.sh target/release/Open-Game-Launcher linux

      - name: Version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: AppImage, .deb, .rpm, Pacman
        run: |
          set -o pipefail
          scripts/package-linux.sh target/release/Open-Game-Launcher "${{ steps.ver.outputs.version }}" ${{ matrix.arch }} deb rpm pacman appimage 2>&1 | tee package-linux-${{ matrix.arch }}.log

      - name: Flatpak
        continue-on-error: true
        run: |
          set -o pipefail
          scripts/package-linux.sh target/release/Open-Game-Launcher "${{ steps.ver.outputs.version }}" ${{ matrix.arch }} flatpak 2>&1 | tee flatpak-${{ matrix.arch }}.log

      - name: Snap
        continue-on-error: true
        run: |
          set -o pipefail
          sudo snap install snapcraft --classic
          scripts/package-linux.sh target/release/Open-Game-Launcher "${{ steps.ver.outputs.version }}" ${{ matrix.arch }} snap 2>&1 | tee snap-${{ matrix.arch }}.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-linux-${{ matrix.arch }}
          path: |
            *.log
            ui-*.png
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  macos:
    name: macOS (Universal)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Design (Tailwind CSS) neu erzeugen
        shell: bash
        run: |
          set -o pipefail
          # Tailwind braucht das Paket "tailwindcss" neben der CSS-Datei (für @import)
          npm install --no-save --no-audit --no-fund --ignore-scripts tailwindcss@4.3.3 @tailwindcss/cli@4.3.3 2>&1 | tee css-${{ runner.os }}-${{ runner.arch }}.log
          npx @tailwindcss/cli -i tailwind.css -o assets/maz.css --minify 2>&1 | tee -a css-${{ runner.os }}-${{ runner.arch }}.log

      - name: Build (Apple Silicon + Intel)
        run: |
          set -o pipefail
          cargo build --release --target aarch64-apple-darwin --message-format=short 2>&1 | tee build-macos.log
          cargo build --release --target x86_64-apple-darwin --message-format=short 2>&1 | tee -a build-macos.log

      - name: Tests
        run: |
          set -o pipefail
          cargo test --release --target aarch64-apple-darwin 2>&1 | tee test-macos.log

      - name: Oberflächen-Test (Bildschirmfoto, ohne Gewähr)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || true
          scripts/ui-test.sh target/aarch64-apple-darwin/release/Open-Game-Launcher macos

      - name: App, .dmg und .zip
        run: |
          set -o pipefail
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          scripts/package-macos.sh target/aarch64-apple-darwin/release/Open-Game-Launcher target/x86_64-apple-darwin/release/Open-Game-Launcher "$v" 2>&1 | tee package-macos.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-macos
          path: |
            *.log
            ui-*.png
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  ci-log:
    name: Fehlerprotokoll speichern
    needs: [windows, linux, macos]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: logs-*
          merge-multiple: true
          path: logs
      - name: In Branch "ci-log" schreiben
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p logs && cd logs
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q --allow-empty -m "CI-Log $SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log

  # --------------------------------------------------------------------------
  release:
    name: Release veröffentlichen
    needs: [windows, linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Herkunftsnachweis (Sigstore): belegt, dass die Dateien genau in dieser CI gebaut wurden
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{windows,linux,macos}*"
          merge-multiple: true
          path: dist

      - name: Prüfsummen
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- *.exe *.AppImage *.deb *.rpm *.pkg.tar.zst *.flatpak *.snap *.dmg *.zip *.ogext 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          # Paketquellen (winget, Scoop, Homebrew, AUR, Flathub) mit den echten Prüfsummen
          v=$(grep -m1 '^version' ../Cargo.toml | cut -d'"' -f2)
          python3 ../scripts/render-packaging.py "$v" SHA256SUMS.txt "pk"
          (cd pk && zip -qr "../OG-Paketquellen-$v.zip" .)
          rm -rf pk
          ls -la

      - name: Gibt es diese Version schon?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION existiert schon – wird nicht überschrieben."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-Text aus CHANGELOG.md
        id: notes
        if: steps.exists.outputs.skip == 'false'
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          # Abschnitt "## [VERSION]" bis zum nächsten "## [" herausschneiden
          # Dazu alle direkt darunter liegenden Test-Versionen – so steht bei einer fertigen Version
          # alles drin, was seit der letzten fertigen Version neu ist.
          awk -v v="$VERSION" '
            /^## \[/ {
              if (state == 0 && index($0, "## [" v "]") == 1) { state = 1; print "## Open Game Launcher " v; next }
              if (state == 1) {
                if ($0 ~ /\(Test\)/) { h = $0; sub(/^## \[/, "", h); sub(/\].*/, "", h); print "---\n## Ebenfalls enthalten: " h; next }
                state = 2
              }
            }
            state == 1 { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt für $VERSION"
            exit 1
          fi
          cat docs/release-footer.md >> RELEASE_BODY.md
          cat RELEASE_BODY.md
          # "## [x.y.z] – … (Test)" → Test-Version: Vorabversion, wird in der App nicht angeboten
          if grep -E "^## \[$VERSION\].*\(Test\)" CHANGELOG.md >/dev/null; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Herkunftsnachweis erstellen (prüfbar mit „gh attestation verify“)
        if: steps.exists.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.flatpak
            dist/*.snap
            dist/*.dmg
            dist/*.zip
            dist/*.ogext

      - name: GitHub-Release erstellen
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Open Game Launcher ${{ needs.windows.outputs.version }}${{ steps.notes.outputs.prerelease == 'true' && ' (Test)' || '' }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.notes.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.flatpak
            dist/*.snap
            dist/*.dmg
            dist/*.zip
            dist/*.ogext
            dist/SHA256SUMS.txt

      - name: Cargo.lock aktuell halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dist/Cargo.lock ] || exit 0
          if cmp -s dist/Cargo.lock Cargo.lock; then echo "Cargo.lock unverändert."; exit 0; fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=main" --jq .sha 2>/dev/null || true)
          base64 -w0 dist/Cargo.lock > lock.b64
          if [ -n "$sha" ]; then
            jq -n --rawfile c lock.b64 --arg sha "$sha" '{message: "Cargo.lock aktualisieren", content: $c, branch: "main", sha: $sha}' > body.json
          else
            jq -n --rawfile c lock.b64 '{message: "Cargo.lock hinzufügen", content: $c, branch: "main"}' > body.json
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/Cargo.lock" --input body.json > /dev/null
          echo "Cargo.lock aktualisiert."

  # --------------------------------------------------------------------------
  pages:
    name: Webseite veröffentlichen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Schriften selbst ausliefern (keine Verbindung zu Google für Besucher)
        run: python3 -I scripts/selfhost-fonts.py site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
