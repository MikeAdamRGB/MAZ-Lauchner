[package]
name = "maz-launcher"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Open Game Launcher (OG) – alle deine Steam-, Epic-, Roblox- und eigenen Spiele in einem schönen Launcher (Windows, macOS, Linux)"
license = "MIT"
repository = "https://github.com/MikeAdamRGB/Open-Game-Launcher"
readme = "README.md"
keywords = ["launcher", "games", "steam", "epic", "dioxus"]
categories = ["games", "gui"]
build = "build.rs"
# examples/ enthält eigenständige Beispiel-Erweiterungen (eigene Crates), keine Cargo-Beispiele
autoexamples = false

[[bin]]
name = "Open-Game-Launcher"
path = "src/main.rs"

[dependencies]
# UI: Dioxus (Grundlage von rust-ui) – nur die minimal nötigen Features
dioxus = { version = "0.7", default-features = false, features = ["desktop", "minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# Nur PNG/JPEG – hält die EXE klein
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# itch.io-Belege (receipt.json.gz) entpacken – reine Rust-Variante, keine C-Bibliothek
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Komplette Bibliotheken aus den lokalen Datenbanken von GOG Galaxy, Amazon Games und itch.io
# lesen (nur lesend). "bundled" = SQLite fest eingebaut, keine System-DLL nötig.
rusqlite = { version = "0.37", features = ["bundled"] }
# HTTP für optionale Online-Funktionen (Steam-API, Cover-Suche).
# native-tls nutzt das in Windows eingebaute SChannel → keine große TLS-Bibliothek in der EXE.
ureq = { version = "3.5", default-features = false, features = ["json", "native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
# PR_SET_PDEATHSIG: Erweiterungs-Prozesse enden mit dem Launcher (libc ist ohnehin schon im Build)
libc = "0.2"
# Dateidialoge über das XDG-Portal (das aktiviert Dioxus bereits; gtk3 + Portal gleichzeitig geht nicht)
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }

[build-dependencies]
winresource = "0.1"

# ------------------------------------------------------------------
# So klein wie möglich: auf Größe optimieren, alles Unnötige raus
# ------------------------------------------------------------------
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

# Abhängigkeiten im Debug-Build optimieren → schnelleres Entwickeln
[profile.dev.package."*"]
opt-level = 2
